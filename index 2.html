<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Sonora</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ff7a45'/%3E%3Cpath d='M9 20v-8M14 24V8M19 22V10M24 18v-4' stroke='%231a0d06' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
@property --tint{syntax:'<color>';inherits:true;initial-value:#24202a}
:root{
  --bg:#07070a;--panel:#111116;--panel2:#18181f;--hover:#23232c;--line:rgba(255,255,255,.08);
  --text:#f5f2ee;--mute:#a4a2ab;--dim:#6e6c77;
  --accent:#ff7a45;--accent-ink:#1a0d06;--danger:#ff5a6a;
  --r:14px;--side:300px;
}
@media (max-width:1000px){:root{--side:76px}}
*{box-sizing:border-box;margin:0;padding:0}
*{scrollbar-width:thin;scrollbar-color:#3a3a45 transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#34343e;border-radius:10px;border:2px solid transparent;background-clip:content-box}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.4 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit}
a{color:inherit}
input,select{font:inherit}
.i{width:22px;height:22px;fill:currentColor;flex:none;display:block}

/* ---------- layout ---------- */
#app{height:100%;display:grid;grid-template-columns:var(--side) minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr) 88px;gap:8px;padding:8px 8px 0}
.panel{background:var(--panel);border-radius:var(--r);min-height:0;overflow:hidden}
#sidebar{grid-column:1;grid-row:1;display:flex;flex-direction:column;gap:8px;min-height:0}
#main{grid-column:2;grid-row:1;display:flex;flex-direction:column;min-width:0;--tint:#24202a;background:linear-gradient(180deg,var(--tint) 0,var(--panel) 420px);transition:--tint .7s ease}
#queuePanel{grid-column:3;grid-row:1;display:none;flex-direction:column;width:340px}
#queuePanel.on{display:flex}
#player{grid-column:1/-1;grid-row:2}

/* ---------- sidebar ---------- */
.brand{display:flex;align-items:center;gap:10px;padding:8px 14px 2px;font-weight:800;font-size:19px;letter-spacing:-.03em}
.brand svg{width:30px;height:30px;flex:none}
.nav{display:flex;flex-direction:column;padding:8px}
.nav a,.lib a{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:10px;color:var(--mute);font-weight:700;text-decoration:none;cursor:pointer;min-width:0}
.nav a:hover,.lib a:hover{color:var(--text)}
.nav a.on,.lib a.on{color:var(--text);background:var(--hover)}
.lib{flex:1;display:flex;flex-direction:column;min-height:0}
.lib-head{display:flex;align-items:center;justify-content:space-between;padding:12px 10px 4px 20px;color:var(--mute);font-weight:800}
.lib-scroll{overflow:auto;padding:4px 8px 12px;min-height:0;flex:1}
.lib .cnt{margin-left:auto;font-size:12px;color:var(--dim);font-weight:600}
.lib .thumb{width:36px;height:36px;border-radius:6px;overflow:hidden;flex:none}
.lib .thumb .cv{width:100%;height:100%;object-fit:cover}
.lib .plname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.lib .sub{display:block;font-weight:500;font-size:12px;color:var(--dim)}
.lib .sep{height:1px;background:var(--line);margin:8px 12px}
@media (max-width:1000px){.lbl,.cnt,.brand span,.lib-head span,.plname{display:none}.nav a,.lib a{justify-content:center;padding:10px 0}.lib-head{justify-content:center;padding:12px 0 4px}.brand{justify-content:center;padding:8px 0 2px}}

/* ---------- main ---------- */
#topbar{display:flex;align-items:center;gap:10px;padding:12px 18px;flex:none}
.round{width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.4);display:grid;place-items:center;color:var(--text);border:0;cursor:pointer}
.round:hover{background:rgba(0,0,0,.6)}
.round .i{width:20px;height:20px}
.search{position:relative;flex:0 1 420px;min-width:120px}
.search input{width:100%;height:42px;border-radius:999px;border:1px solid transparent;background:rgba(255,255,255,.09);color:var(--text);padding:0 16px 0 44px;font-size:14px;outline:none;user-select:text;-webkit-user-select:text}
.search input::placeholder{color:var(--mute)}
.search input:focus{border-color:rgba(255,255,255,.4);background:rgba(255,255,255,.13)}
.search .i{position:absolute;left:14px;top:10px;color:var(--mute);pointer-events:none}
.spacer{flex:1}
.pillbtn{display:inline-flex;align-items:center;gap:8px;height:38px;padding:0 16px;border-radius:999px;border:0;background:#fff;color:#000;font-weight:700;cursor:pointer;white-space:nowrap;flex:none}
.pillbtn:hover{transform:scale(1.03)}
.pillbtn .i{width:18px;height:18px}
@media (max-width:760px){.pillbtn span{display:none}.pillbtn{padding:0 10px}}
#view{flex:1;overflow:auto;min-height:0;padding:0 8px 24px}
.pad{padding:8px 16px}
.greet{font-size:30px;font-weight:800;letter-spacing:-.035em;padding:6px 16px 16px}

/* ---------- hero ---------- */
.hero{display:flex;align-items:flex-end;gap:24px;padding:16px 16px 20px}
.hero>.cv{width:clamp(110px,17vw,232px);height:auto;aspect-ratio:1;border-radius:8px;box-shadow:0 14px 44px rgba(0,0,0,.55);flex:none;object-fit:cover}
.hero.round>.cv{border-radius:50%}
.hero .hinfo{min-width:0}
.hero .kind{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.09em;opacity:.85}
.hero h1{font-size:clamp(28px,5.2vw,64px);line-height:1.04;font-weight:800;letter-spacing:-.04em;margin:6px 0 12px;overflow-wrap:anywhere}
.hero .meta{color:rgba(255,255,255,.82);font-size:14px}
.hero .meta a{text-decoration:none;font-weight:700}.hero .meta a:hover{text-decoration:underline}
.hero.small{padding-bottom:6px}
.hero.small h1{font-size:clamp(28px,4vw,44px);margin:2px 0 6px}
.actions{display:flex;align-items:center;gap:14px;padding:6px 16px 18px;flex-wrap:wrap}
.bigplay{width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;border:0;cursor:pointer;transition:transform .12s}
.bigplay:hover{transform:scale(1.06)}
.bigplay .i{width:28px;height:28px}
.actions .ib{width:42px;height:42px}.actions .ib .i{width:26px;height:26px}
.sel{height:36px;border-radius:999px;background:rgba(255,255,255,.1);border:1px solid var(--line);color:var(--text);padding:0 14px;outline:none;cursor:pointer;margin-left:auto}
.sel option{background:#1c1c24}
.btn{height:40px;padding:0 20px;border-radius:999px;border:0;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--text);border:1px solid rgba(255,255,255,.28)}
.btn.danger{background:var(--danger);color:#fff}

/* ---------- covers ---------- */
.cv{display:block;background:var(--panel2)}
.ph{display:grid;place-items:center;background:linear-gradient(135deg,hsl(var(--h,20) 42% 30%),hsl(calc(var(--h,20) + 40) 48% 17%));color:rgba(255,255,255,.55)}
.ph .i{width:38%;height:38%}
.ph.liked{background:linear-gradient(135deg,#ff7a45,#b3175f);color:#fff}
.mos{display:grid;grid-template-columns:1fr 1fr;overflow:hidden}
.mos img{width:100%;height:100%;object-fit:cover;aspect-ratio:1;display:block}
.thumb{width:40px;height:40px;border-radius:4px;flex:none;object-fit:cover}
.thumb.ph .i{width:50%;height:50%}

/* ---------- cards / sections ---------- */
.sec{padding:10px 8px 6px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;padding:0 12px 8px}
.sec-h h2{font-size:22px;font-weight:800;letter-spacing:-.025em}
.sec-h a{color:var(--mute);font-weight:700;font-size:13px;text-decoration:none}
.sec-h a:hover{text-decoration:underline;color:var(--text)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:6px;padding:0 4px}
.card{position:relative;padding:12px;border-radius:12px;cursor:pointer;transition:background .15s;min-width:0}
.card:hover{background:rgba(255,255,255,.07)}
.card .cvw{position:relative;margin-bottom:12px}
.card .cv{width:100%;aspect-ratio:1;border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.4);object-fit:cover}
.card.circ .cv{border-radius:50%}
.card .pb{position:absolute;right:8px;bottom:8px;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;display:grid;place-items:center;opacity:0;transform:translateY(8px);transition:.18s;box-shadow:0 8px 20px rgba(0,0,0,.5);cursor:pointer}
.card:hover .pb,.card .pb:focus-visible{opacity:1;transform:none}
.card .pb:hover{transform:scale(1.07)}
.card .c1{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .c2{color:var(--mute);font-size:13px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card.add .cvw .cv{display:grid;place-items:center;background:rgba(255,255,255,.06);color:var(--mute);box-shadow:none}
.card.add .cv .i{width:40%;height:40%}
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px;padding:0 12px 14px}
.qt{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.08);border-radius:8px;overflow:hidden;cursor:pointer;position:relative;padding-right:12px;min-height:64px;transition:background .15s}
.qt:hover{background:rgba(255,255,255,.15)}
.qt>.cv{width:64px;height:64px;flex:none;object-fit:cover}
.qt .q1{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qt .pb{width:40px;height:40px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;display:grid;place-items:center;opacity:0;transition:.18s;flex:none;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.5)}
.qt:hover .pb{opacity:1}

/* ---------- track list ---------- */
.tl{padding:0 4px}
.row,.thead{display:grid;grid-template-columns:40px minmax(160px,5fr) minmax(100px,3fr) 32px 56px 32px;align-items:center;gap:12px;padding:6px 12px;border-radius:8px}
.row.noalb,.thead.noalb{grid-template-columns:40px minmax(160px,1fr) 32px 56px 32px}
@media (max-width:900px){.row,.thead{grid-template-columns:36px minmax(120px,1fr) 32px 48px 32px}.alb{display:none}}
.thead{color:var(--mute);font-size:12px;text-transform:uppercase;letter-spacing:.08em;border-bottom:1px solid var(--line);border-radius:0;margin:0 8px 6px;padding:0 4px 8px}
.thead .r{display:flex;justify-content:flex-end}
.thead .i{width:16px;height:16px}
.row{cursor:default;position:relative}
.row:hover{background:rgba(255,255,255,.07)}
.row.dragover{box-shadow:0 -2px 0 var(--accent)}
.row .ttl{display:flex;align-items:center;gap:12px;min-width:0}
.row .tt{min-width:0}
.t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t2,.alb{color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.t2 a,.alb a{color:inherit;text-decoration:none}
.t2 a:hover,.alb a:hover{color:var(--text);text-decoration:underline}
.dur{color:var(--mute);text-align:right;font-variant-numeric:tabular-nums}
.row.playing .t1{color:var(--accent)}
.row .idx{position:relative;text-align:center;color:var(--mute);font-variant-numeric:tabular-nums;height:28px;display:grid;place-items:center}
.row .idx>*{grid-area:1/1}
.row .rp{display:none}
.row:hover .n{display:none}
.row:hover .rp{display:grid}
.row .eq{display:none}
.row.playing .n{display:none}
.row.playing .eq{display:flex}
.row.playing:hover .eq{display:none}
.eq{gap:2px;align-items:flex-end;height:14px;justify-content:center}
.eq i{width:3px;background:var(--accent);height:35%;border-radius:1px}
body.is-playing .eq i{animation:eq .9s ease-in-out infinite}
.eq i:nth-child(2){animation-delay:-.4s!important}.eq i:nth-child(3){animation-delay:-.7s!important}
@keyframes eq{0%,100%{height:25%}50%{height:100%}}
.row .heart{opacity:0}
.row:hover .heart,.row .heart.on{opacity:1}
.more{height:1px}
@media (hover:none){.row .heart{opacity:1}}

/* ---------- buttons ---------- */
.ib{width:34px;height:34px;border-radius:50%;border:0;background:transparent;color:var(--mute);display:inline-grid;place-items:center;cursor:pointer;flex:none;transition:color .12s,transform .12s;position:relative}
.ib:hover{color:var(--text)}
.ib.sm{width:28px;height:28px}.ib.sm .i{width:18px;height:18px}
.ib.on{color:var(--accent)}
.ib.heart.on{color:var(--accent)}
.tgl.on::after{content:"";position:absolute;bottom:1px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--accent)}
.ib:focus-visible,.play:focus-visible,.bigplay:focus-visible,.btn:focus-visible,.round:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- player ---------- */
#player{display:grid;grid-template-columns:minmax(180px,1fr) minmax(300px,640px) minmax(180px,1fr);align-items:center;gap:16px;padding:0 16px;background:var(--bg)}
.np{display:flex;align-items:center;gap:12px;min-width:0}
.npcv{width:58px;height:58px;border-radius:6px;flex:none;overflow:hidden;background:var(--panel2)}
.npcv .cv{width:100%;height:100%;object-fit:cover}
.npinfo{min-width:0;flex:1}
.npt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.npa{color:var(--mute);font-size:12px;text-decoration:none;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
a.npa:hover{color:var(--text);text-decoration:underline}
.ctl{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.btns{display:flex;align-items:center;gap:10px}
.play{width:38px;height:38px;border-radius:50%;background:#fff;color:#000;border:0;display:grid;place-items:center;cursor:pointer;transition:transform .1s}
.play:hover{transform:scale(1.07)}
.play .i{width:22px;height:22px}
.seek{display:flex;align-items:center;gap:10px;width:100%}
.seek span{color:var(--mute);font-size:11px;font-variant-numeric:tabular-nums;min-width:40px}
.seek span:first-child{text-align:right}
#seek{flex:1;min-width:0}
.ext{display:flex;align-items:center;justify-content:flex-end;gap:4px}
#vol{width:110px;flex:none}
input[type=range]{-webkit-appearance:none;appearance:none;height:16px;background:transparent;cursor:pointer;outline:none}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--fill,#fff) var(--p,0%),rgba(255,255,255,.22) var(--p,0%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;background:#fff;margin-top:-4px;opacity:0;transition:opacity .1s}
input[type=range]:hover::-webkit-slider-thumb,input[type=range]:focus-visible::-webkit-slider-thumb{opacity:1}
input[type=range]:hover{--fill:var(--accent)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:rgba(255,255,255,.22)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--fill,#fff)}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border:0;border-radius:50%;background:#fff}

/* ---------- queue ---------- */
.qh{display:flex;justify-content:space-between;align-items:center;padding:16px 12px 6px 18px;font-weight:800;font-size:18px;letter-spacing:-.02em}
.qs{overflow:auto;padding:0 8px 16px;flex:1;min-height:0}
.qlabel{display:flex;justify-content:space-between;align-items:center;padding:14px 10px 6px;color:var(--mute);font-weight:700;font-size:13px}
.qlabel button{background:none;border:0;color:var(--mute);cursor:pointer;font-weight:700;font-size:12px}
.qlabel button:hover{color:var(--text);text-decoration:underline}
.qrow{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;cursor:pointer}
.qrow:hover{background:rgba(255,255,255,.07)}
.qrow .tt{flex:1;min-width:0}
.qrow.cur .t1{color:var(--accent)}
.qrow .ib{opacity:0}.qrow:hover .ib{opacity:1}

/* ---------- overlays ---------- */
#menu{position:fixed;z-index:50;display:none;min-width:230px;background:#24242d;border-radius:10px;padding:4px;box-shadow:0 16px 48px rgba(0,0,0,.6);border:1px solid var(--line);left:0;top:0}
#menu.on{display:block}
.mi{display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px;border:0;background:transparent;color:var(--text);border-radius:6px;cursor:pointer;text-align:left}
.mi:hover{background:rgba(255,255,255,.1)}
.mi .i{width:18px;height:18px;color:var(--mute)}
.mi .ph0{width:18px;flex:none}
.mi.danger,.mi.danger .i{color:var(--danger)}
.msep{height:1px;background:var(--line);margin:4px 0}
#modal{position:fixed;inset:0;z-index:60;display:none;place-items:center}
#modal.on{display:grid}
.mbg{position:absolute;inset:0;background:rgba(0,0,0,.66);backdrop-filter:blur(2px)}
.mbox{position:relative;background:#1c1c24;border-radius:16px;padding:24px;width:min(440px,calc(100vw - 32px));box-shadow:0 24px 80px rgba(0,0,0,.7);max-height:86vh;overflow:auto;border:1px solid var(--line)}
.mbox h3{font-size:20px;font-weight:800;letter-spacing:-.02em;margin-bottom:14px}
.mbox p{color:var(--mute);line-height:1.5}
.inp{width:100%;height:42px;border-radius:8px;border:1px solid var(--line);background:rgba(255,255,255,.07);color:var(--text);padding:0 12px;outline:none;user-select:text;-webkit-user-select:text}
.inp:focus{border-color:var(--accent)}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;color:var(--mute);font-size:12px;margin-bottom:4px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mact{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}
.plpick{display:flex;flex-direction:column;gap:2px;max-height:50vh;overflow:auto;margin:0 -8px}
.plpick .mi{padding:8px}
.plpick .thumb{width:40px;height:40px}
.kbd{display:grid;grid-template-columns:auto 1fr;gap:8px 18px;color:var(--mute)}
.kbd b{color:var(--text);font-weight:700}
kbd{background:rgba(255,255,255,.1);border-radius:5px;padding:2px 7px;font:600 12px ui-monospace,monospace;color:var(--text)}
#toast{position:fixed;left:50%;bottom:104px;transform:translate(-50%,16px);background:#fff;color:#111;padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;pointer-events:none;transition:.22s;z-index:80;max-width:min(520px,90vw);text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#prog{position:fixed;left:50%;bottom:104px;transform:translateX(-50%);background:#1f1f28;border:1px solid var(--line);padding:12px 18px;border-radius:14px;z-index:81;display:none;min-width:260px;box-shadow:0 12px 40px rgba(0,0,0,.6)}
#prog.on{display:block}
#prog .bar{height:4px;border-radius:2px;background:rgba(255,255,255,.15);margin-top:8px;overflow:hidden}
#prog .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
#prog .pt{font-weight:600;font-size:13px}
#drop{position:fixed;inset:10px;z-index:90;display:none;place-items:center;background:rgba(7,7,10,.86);border:3px dashed var(--accent);border-radius:20px;font-size:26px;font-weight:800;letter-spacing:-.02em;text-align:center;pointer-events:none}
#drop.on{display:grid}
#drop small{display:block;font-size:14px;font-weight:500;color:var(--mute);margin-top:6px}

/* ---------- empty ---------- */
.empty{display:grid;justify-items:center;text-align:center;padding:9vh 24px;gap:14px}
.empty .big{width:104px;height:104px;border-radius:28px;background:linear-gradient(135deg,var(--accent),#ffb36b);display:grid;place-items:center;color:var(--accent-ink);margin-bottom:6px;transform:rotate(-6deg);box-shadow:0 20px 50px rgba(255,122,69,.28)}
.empty .big .i{width:54px;height:54px}
.empty h2{font-size:30px;font-weight:800;letter-spacing:-.035em}
.empty p{color:var(--mute);max-width:440px;line-height:1.55}
.empty .rowb{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:6px}

/* ---------- navegación compacta (ventanas estrechas) y táctil ---------- */
#mnav{display:none;gap:8px;overflow-x:auto;padding:0 12px 10px;flex:none;scrollbar-width:none}
#mnav::-webkit-scrollbar{display:none}
#mnav a{flex:none;padding:7px 14px;border-radius:999px;background:rgba(255,255,255,.1);font-weight:700;text-decoration:none;font-size:13px;color:var(--text)}
#mnav a.on{background:#fff;color:#000}

<script>
'use strict';
/* =====================================================================
   Sonora — reproductor de música local (un solo archivo, sin librerías)
   ===================================================================== */

/* ---------- utilidades ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const COLL = new Intl.Collator('es', { sensitivity: 'base', numeric: true });

function hash(str) { // cyrb53
  let h1 = 0xdeadbeef, h2 = 0x41c6ce57;
  for (let i = 0, ch; i < str.length; i++) {
    ch = str.charCodeAt(i);
    h1 = Math.imul(h1 ^ ch, 2654435761);
    h2 = Math.imul(h2 ^ ch, 1597334677);
  }
  h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
  h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
  return (4294967296 * (2097151 & h2) + (h1 >>> 0)).toString(36);
}
const uid = () => hash(Math.random() + '|' + Date.now() + '|' + performance.now());
const hue = s => parseInt(hash(String(s)).slice(0, 4), 36) % 360;

function fmtTime(s) {
  s = Math.max(0, Math.floor(s || 0));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return h ? `${h}:${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')}` : `${m}:${String(x).padStart(2, '0')}`;
}
function fmtLong(s) {
  s = Math.round(s || 0);
  const h = Math.floor(s / 3600), m = Math.round(s % 3600 / 60);
  return h ? `${h} h ${m} min` : `${Math.max(1, m)} min`;
}
const plural = (n, a, b) => n === 1 ? `1 ${a}` : `${n.toLocaleString('es')} ${b}`;
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };
function shuffleArr(a) {
  a = a.slice();
  for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
  return a;
}
const ic = (n, cls = '') => `<svg class="i ${cls}"><use href="#i-${n}"/></svg>`;
function setIcon(btn, name) { const u = btn.querySelector('use'); if (u) u.setAttribute('href', '#i-' + name); }
function setRange(el) {
  const min = +el.min || 0, max = +el.max || 100;
  el.style.setProperty('--p', ((el.value - min) / (max - min) * 100) + '%');
}

/* ---------- base de datos (IndexedDB, con modo temporal si no hay) ---------- */
const DB = {
  db: null, ok: false,
  mem: { tracks: new Map(), files: new Map(), covers: new Map(), kv: new Map() },
  inline: { tracks: true, covers: true },
  async open() {
    try {
      this.db = await new Promise((res, rej) => {
        const r = indexedDB.open('sonora', 1);
        r.onupgradeneeded = () => {
          const d = r.result;
          d.createObjectStore('tracks', { keyPath: 'id' });
          d.createObjectStore('covers', { keyPath: 'key' });
          d.createObjectStore('files');
          d.createObjectStore('kv');
        };
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
        r.onblocked = () => rej(new Error('bloqueado'));
      });
      this.ok = true;
    } catch (e) {
      console.warn('IndexedDB no disponible: modo temporal', e);
      this.ok = false;
    }
  },
  _tx(store, mode, fn) {
    return new Promise((res, rej) => {
      const tx = this.db.transaction(store, mode);
      let req;
      try { req = fn(tx.objectStore(store)); } catch (e) { rej(e); return; }
      tx.oncomplete = () => res(req ? req.result : undefined);
      tx.onerror = () => rej(tx.error);
      tx.onabort = () => rej(tx.error || new Error('transacción cancelada'));
    });
  },
  get(store, key) {
    return this.ok ? this._tx(store, 'readonly', s => s.get(key)) : Promise.resolve(this.mem[store].get(key));
  },
  put(store, val, key) {
    if (!this.ok) { this.mem[store].set(this.inline[store] ? (val.id ?? val.key) : key, val); return Promise.resolve(); }
    return this._tx(store, 'readwrite', s => this.inline[store] ? s.put(val) : s.put(val, key));
  },
  del(store, key) {
    if (!this.ok) { this.mem[store].delete(key); return Promise.resolve(); }
    return this._tx(store, 'readwrite', s => s.delete(key));
  },
  all(store) {
    return this.ok ? this._tx(store, 'readonly', s => s.getAll()) : Promise.resolve([...this.mem[store].values()]);
  },
  clear(store) {
    if (!this.ok) { this.mem[store].clear(); return Promise.resolve(); }
    return this._tx(store, 'readwrite', s => s.clear());
  }
};
const kv = { get: k => DB.get('kv', k), set: (k, v) => DB.put('kv', v, k) };

function fromFilename(name) {
  let base = name.replace(/\.[^.]+$/, '').replace(/_/g, ' ').trim();
  base = base.replace(/^\s*\d{1,3}\s*[-–.)]\s*/, '');

function cmpAlbumTrack(a, b) {
  const x = T(a), y = T(b);
  return ((x.track || 1e9) - (y.track || 1e9)) || COLL.compare(x.title, y.title);
}

function reindex() {
  S.artists.clear(); S.albums.clear();
  for (const t of S.tracks.values()) {
    t._s = norm(`${t.title} ${t.artist} ${t.albumArtist || ''} ${t.album}`);
    const an = mainArtist(t), aid = hash('a:' + norm(an));
    let ar = S.artists.get(aid);
    if (!ar) { ar = { id: aid, name: an, ids: [], albums: new Set(), plays: 0 }; S.artists.set(aid, ar); }
    ar.ids.push(t.id); ar.plays += t.plays || 0;
    const bid = hash('b:' + norm(an) + '|' + norm(t.album || ''));
    let al = S.albums.get(bid);
    if (!al) { al = { id: bid, name: t.album || 'Sin álbum', artist: an, artistId: aid, ids: [], year: 0, added: 0, dur: 0 }; S.albums.set(bid, al); }
    al.ids.push(t.id); al.year = al.year || t.year || 0; al.added = Math.max(al.added, t.added || 0); al.dur += t.duration || 0;
    ar.albums.add(bid);
    t._aid = aid; t._bid = bid;
  }
  for (const al of S.albums.values()) {
    al.ids.sort(cmpAlbumTrack);
    const withCover = al.ids.map(T).find(t => S.covers.has(t.coverKey));
    al.coverUrl = withCover ? S.covers.get(withCover.coverKey) : null;
  }
  for (const ar of S.artists.values()) {
    const al = [...ar.albums].map(b => S.albums.get(b)).find(a => a.coverUrl);
    ar.coverUrl = al ? al.coverUrl : null;
    ar.ids.sort((a, b) => COLL.compare(albumName(T(a)), albumName(T(b))) || cmpAlbumTrack(a, b));
  }
}

function sortedSongs() {
  const a = [...S.tracks.values()], k = S.sortSongs;
  const c = COLL.compare.bind(COLL);
  const by = {
    title: (x, y) => c(x.title, y.title),
    artist: (x, y) => c(artistName(x), artistName(y)) || c(albumName(x), albumName(y)) || ((x.track || 0) - (y.track || 0)),
    album: (x, y) => c(albumName(x), albumName(y)) || ((x.track || 0) - (y.track || 0)),
    plays: (x, y) => (y.plays || 0) - (x.plays || 0) || c(x.title, y.title),
    recent: (x, y) => (y.added || 0) - (x.added || 0)
  };
  return a.sort(by[k] || by.recent).map(t => t.id);
}
const likedIds = () => [...S.likes].filter(id => S.tracks.has(id)).reverse();
function playlistIds(p) { return p.ids.filter(id => S.tracks.has(id)); }

function idsFor(kind, id) {

    case 'album': return (S.albums.get(id) || { ids: [] }).ids.slice();
    case 'artist': return (S.artists.get(id) || { ids: [] }).ids.slice();
    case 'playlist': { const p = S.playlists.find(x => x.id === id); return p ? playlistIds(p) : []; }
    case 'liked': return likedIds();
    case 'songs': return sortedSongs();

}

/* colores dominantes de las portadas (para el degradado de cabecera) */
const colorCache = new Map();
function dominant(url) {
  if (!url) return Promise.resolve(null);
  if (colorCache.has(url)) return colorCache.get(url);
  const p = new Promise(res => {
    const im = new Image();
    im.onload = () => {
      try {
        const c = document.createElement('canvas'); c.width = c.height = 16;
        const x = c.getContext('2d', { willReadFrequently: true });
        x.drawImage(im, 0, 0, 16, 16);
        const d = x.getImageData(0, 0, 16, 16).data;
        let r = 0, g = 0, b = 0, w = 0;
        for (let i = 0; i < d.length; i += 4) {
          const R = d[i], G = d[i + 1], B = d[i + 2];
          const mx = Math.max(R, G, B), mn = Math.min(R, G, B), sat = (mx - mn) / (mx || 1);
          const wt = 0.15 + sat * sat * 3;
          r += R * wt; g += G * wt; b += B * wt; w += wt;
        }
        res([r / w | 0, g / w | 0, b / w | 0]);
      } catch { res(null); }
    };
    im.onerror = () => res(null);
    im.src = url;
  });
  colorCache.set(url, p);
  return p;
}

const P = {

  queue: [], history: [], cur: null,
  shuffle: false, repeat: 0,           // 0 no · 1 todo · 2 una
  token: 0, url: null, counted: false, errors: 0, seeking: false, lastMS: 0, lastSave: 0,

/* Tipo MIME real según los primeros bytes. Chrome lo deduce solo, pero Safari y Firefox
   se fían del tipo del archivo, que a veces viene vacío o equivocado (p. ej. un .mp3 que en realidad es M4A). */
async function sniffAudioType(blob) {
  try {
    const b = new Uint8Array(await blob.slice(0, 12).arrayBuffer());
    const s = (a, z) => String.fromCharCode(...b.subarray(a, z));
    if (s(0, 4) === 'OggS') return 'audio/ogg';
    if (s(0, 4) === 'fLaC') return 'audio/flac';
    if (s(0, 4) === 'RIFF' && s(8, 12) === 'WAVE') return 'audio/wav';
    if (s(4, 8) === 'ftyp') return 'audio/mp4';
    if (s(0, 3) === 'ID3') return 'audio/mpeg';
    if (b[0] === 0xFF && (b[1] & 0xE0) === 0xE0) return (b[1] & 0x06) === 0 ? 'audio/aac' : 'audio/mpeg'; // capa 00 = AAC (ADTS)
  } catch { }
  return '';
}
const AUDIO_ERR = { 2: 'no se pudo leer el archivo guardado', 3: 'el audio está dañado o no se puede decodificar', 4: 'el navegador no reconoce este formato o el archivo está dañado' };
function audioErrText(e) {
  const m = String(e.message || '').replace(/^MEDIA_ELEMENT_ERROR:\s*/i, '').trim().slice(0, 90);
  return (AUDIO_ERR[e.code] || 'error desconocido') + ` [código ${e.code}${m ? ': ' + m : ''}]`;
}
const savePlayer = debounce(() => kv.set('player', { cur: P.cur, ctx: P.ctx, queue: P.queue }), 500);
const saveSettings = debounce(() => kv.set('settings', { vol: audio.volume, muted: audio.muted, shuffle: P.shuffle, repeat: P.repeat, q: S.qOpen }), 300);

function mkOrder(list, idx) {
  if (!P.shuffle) return { order: list.slice(), pos: idx };
  const first = list[idx];
  return { order: [first, ...shuffleArr(list.filter((_, i) => i !== idx))], pos: 0 };
}

function playList(list, idx = 0, name = '') {
  list = list.filter(id => S.tracks.has(id));
  if (!list.length) return;
  if (idx < 0 || idx >= list.length) idx = P.shuffle ? Math.floor(Math.random() * list.length) : 0;
  const o = mkOrder(list, idx);
  P.ctx = { list: list.slice(), order: o.order, pos: o.pos, name };
  start(o.order[o.pos], { pos: o.pos });
}

function start(id, { pos, auto = false } = {}) {
  if (!S.tracks.has(id)) return;
  if (P.cur && P.cur !== id) { P.history.push({ id: P.cur, pos: P.ctx.pos }); if (P.history.length > 300) P.history.shift(); }
  if (pos != null) P.ctx.pos = pos;
  return load(id, { autoplay: true, auto });
}

async function load(id, { autoplay = true, seek = 0, alt = false, auto = false } = {}) {
  const my = ++P.token;
  const t = T(id); if (!t) return;
  if (!alt) { P.auto = !!auto; P.altTried = null; }
  let blob = await DB.get('files', id);
  if (my !== P.token) return;
  if (!blob) { toast('No encuentro el archivo de «' + t.title + '»'); return; }
  // tipo real según el contenido; en el reintento (alt) se quita el tipo y el navegador decide solo
  const real = alt ? '' : await sniffAudioType(blob);
  if (my !== P.token) return;
  if (alt ? blob.type !== '' : (real && blob.type !== real)) blob = new Blob([blob], { type: real });
  if (P.url) URL.revokeObjectURL(P.url);
  P.url = URL.createObjectURL(blob);
  P.cur = id; P.counted = false;
  audio.src = P.url;
  if (seek > 0) audio.addEventListener('loadedmetadata', () => { try { audio.currentTime = seek; } catch { } }, { once: true });
  if (autoplay) audio.play().catch(e => { if (e.name !== 'AbortError') console.warn(e); });
  t.last = Date.now(); persistTrack(t);
  npUpdate(); savePlayer();
}

function toggle() {
  if (!P.cur) { const ids = sortedSongs(); if (ids.length) playList(ids, 0, 'Canciones'); return; }
  if (audio.paused) audio.play().catch(() => { }); else audio.pause();
}

function next(auto = false) {
  if (auto && P.repeat === 2) { audio.currentTime = 0; audio.play().catch(() => { }); return; }
  if (P.queue.length) { start(P.queue.shift(), { auto }); savePlayer(); return; }
  const o = P.ctx.order;
  if (!o.length) { audio.pause(); return; }
  let np = P.ctx.pos + 1;
  if (np >= o.length) {
    if (auto && P.repeat === 0) { audio.pause(); audio.currentTime = 0; return; }
    if (P.shuffle) P.ctx.order = shuffleArr(P.ctx.list);
    np = 0;
  }
  start(P.ctx.order[np], { pos: np, auto });
}

function prev() {
  if (!P.cur) return;
  if (audio.currentTime > 3) { audio.currentTime = 0; return; }
  const h = P.history.pop();
  if (h && T(h.id)) { P.ctx.pos = h.pos; load(h.id); return; }
  if (P.ctx.pos > 0) { P.ctx.pos--; load(P.ctx.order[P.ctx.pos]); return; }
  audio.currentTime = 0;
}

function setShuffle(on, rebuild = true) {
  P.shuffle = !!on;
  $('#bShuffle').classList.toggle('on', P.shuffle);
  if (rebuild && P.ctx.list.length) {
    const cur = P.cur, idx = P.ctx.list.indexOf(cur);
    if (P.shuffle) {
      P.ctx.order = idx >= 0 ? [cur, ...shuffleArr(P.ctx.list.filter(x => x !== cur))] : shuffleArr(P.ctx.list);
      P.ctx.pos = idx >= 0 ? 0 : -1;
    } else { P.ctx.order = P.ctx.list.slice(); P.ctx.pos = idx; }
  }
  $$('[data-act="shuffle-all"]').forEach(b => b.classList.toggle('on', P.shuffle));
  saveSettings(); savePlayer(); renderQueue();
}

function msPos() {
  if (!('mediaSession' in navigator) || !navigator.mediaSession.setPositionState) return;
  const d = audio.duration; if (!isFinite(d) || d <= 0) return;
  try { navigator.mediaSession.setPositionState({ duration: d, playbackRate: audio.playbackRate || 1, position: Math.min(audio.currentTime, d) }); } catch { }
}

const seekEl = $('#seek');
seekEl.addEventListener('input', () => {
  P.seeking = true; setRange(seekEl);
  $('#tCur').textContent = fmtTime(seekEl.value / 1000 * (audio.duration || 0));
});
seekEl.addEventListener('change', () => {
  if (isFinite(audio.duration) && audio.duration > 0) audio.currentTime = seekEl.value / 1000 * audio.duration;
  P.seeking = false;
});

audio.addEventListener('play', () => { syncPlayState(); msPos(); });
audio.addEventListener('pause', syncPlayState);

audio.addEventListener('loadedmetadata', () => { msPos(); });
audio.addEventListener('durationchange', () => {
  const d = audio.duration; if (!isFinite(d) || d <= 0) return;
  $('#tDur').textContent = fmtTime(d);
  const t = P.cur && T(P.cur);
  if (t && Math.abs((t.duration || 0) - d) > 2) { t.duration = d; persistTrack(t); }
});
audio.addEventListener('timeupdate', () => {
  const d = audio.duration, c = audio.currentTime;
  if (!P.seeking) {
    seekEl.value = d > 0 && isFinite(d) ? Math.round(c / d * 1000) : 0; setRange(seekEl);
    $('#tCur').textContent = fmtTime(c);
  }
  if (!P.counted && P.cur && (c >= 30 || (d > 0 && c >= d * 0.5))) {
    P.counted = true;
    const t = T(P.cur); if (t) { t.plays = (t.plays || 0) + 1; persistTrack(t); }
  }
  const now = performance.now();
  if (now - P.lastMS > 1000) { P.lastMS = now; msPos(); }
  if (now - P.lastSave > 5000 && P.cur) { P.lastSave = now; kv.set('time', { id: P.cur, t: c }); }
});

  const t = P.cur && T(P.cur), e = audio.error;
  if (!audio.src || !t || !e || e.code === 1) return;        // 1 = cancelado por nosotros al cambiar de canción
  console.warn('Error de audio', { codigo: e.code, mensaje: e.message, archivo: t.name, tipo: t.type, bytes: t.size });
  if (P.altTried !== t.id) { P.altTried = t.id; load(t.id, { autoplay: true, alt: true }); return; }  // un solo reintento, sin tipo MIME
  toast(`No se puede reproducir «${t.title}»: ${audioErrText(e)}`, 7000);
  if (P.auto && ++P.errors <= 3) setTimeout(() => next(true), 1200);   // solo salta sola si la canción empezó sola
});

function qRow(id, attrs, cur, removable) {
  const t = T(id); if (!t) return '';
  return `<div class="qrow ${cur ? 'cur' : ''}" ${attrs}>${imgHTML(coverOf(t), t.title, 'thumb')}<div class="tt"><div class="t1">${esc(t.title)}</div><div class="t2">${esc(artistName(t))}</div></div>${removable ? `<button class="ib sm" data-qrm title="Quitar de la cola">${ic('close')}</button>` : ''}</div>`;
}
function renderQueue() {
  if (!S.qOpen) return;
  const el = $('#queuePanel');
  let h = `<div class="qh"><span>Cola</span><button class="ib" data-qclose title="Cerrar">${ic('close')}</button></div><div class="qs">`;
  if (P.cur && T(P.cur)) h += `<div class="qlabel">Reproduciendo ahora</div>` + qRow(P.cur, `data-qplay="now"`, true, false);
  if (P.queue.length) {
    h += `<div class="qlabel"><span>En cola</span><button data-qclear>Vaciar</button></div>`;
    h += P.queue.map((id, i) => qRow(id, `data-q="${i}"`, false, true)).join('');
  }
  const o = P.ctx.order, ups = [];
  for (let i = P.ctx.pos + 1; i < o.length && ups.length < 100; i++) ups.push(i);
  if (ups.length) {
    h += `<div class="qlabel">A continuación${P.ctx.name ? ' · ' + esc(P.ctx.name) : ''}</div>`;
    h += ups.map(i => qRow(o[i], `data-pos="${i}"`, false, false)).join('');
  }
  if (!P.cur) h += `<div class="qlabel" style="padding-top:30px">No hay nada en la cola. Reproduce una canción para empezar.</div>`;
  el.innerHTML = h + '</div>';
}
$('#queuePanel').addEventListener('click', e => {
  if (e.target.closest('[data-qclose]')) return toggleQueue(false);
  if (e.target.closest('[data-qclear]')) { P.queue = []; renderQueue(); savePlayer(); return; }
  const rm = e.target.closest('[data-qrm]');
  if (rm) { P.queue.splice(+rm.closest('[data-q]').dataset.q, 1); renderQueue(); savePlayer(); return; }
  const r = e.target.closest('.qrow'); if (!r) return;
  if (r.dataset.qplay) { toggle(); return; }
  if (r.dataset.q != null) { const [id] = P.queue.splice(+r.dataset.q, 1); start(id); savePlayer(); return; }
  if (r.dataset.pos != null) { const p = +r.dataset.pos; start(P.ctx.order[p], { pos: p }); }
});

function askText({ title, label = '', value = '', ok = 'Guardar' }) {
  return new Promise(res => {
    modal(`<h3>${esc(title)}</h3><input id="mi" class="inp" value="${esc(value)}" placeholder="${esc(label)}" maxlength="120" autocomplete="off"><div class="mact"><button class="btn ghost" data-m="x">Cancelar</button><button class="btn pri" data-m="ok">${esc(ok)}</button></div>`);
    const inp = $('#mi'); inp.focus(); inp.select();
    const done = v => { closeModal(); res(v); };
    $('#modal').onclick = e => { const b = e.target.closest('[data-m]'); if (b) done(b.dataset.m === 'ok' ? (inp.value.trim() || null) : null); };
    inp.onkeydown = e => { if (e.key === 'Enter') done(inp.value.trim() || null); if (e.key === 'Escape') done(null); };
  });
}
function confirmBox({ title, text, ok = 'Aceptar', danger = false }) {
  return new Promise(res => {
    modal(`<h3>${esc(title)}</h3><p>${esc(text)}</p><div class="mact"><button class="btn ghost" data-m="x">Cancelar</button><button class="btn ${danger ? 'danger' : 'pri'}" data-m="ok">${esc(ok)}</button></div>`);
    $('#modal').onclick = e => { const b = e.target.closest('[data-m]'); if (b) { closeModal(); res(b.dataset.m === 'ok'); } };
    $('#modal .btn:last-child').focus();
  });
}

/* ---------- me gusta ---------- */
function toggleLike(id) {
  if (S.likes.has(id)) S.likes.delete(id); else S.likes.add(id);
  saveLikes(); syncLike(); renderSidebar();
  const on = S.likes.has(id);
  $$(`#view .row[data-id="${id}"] .heart`).forEach(b => { b.classList.toggle('on', on); setIcon(b, on ? 'heart-fill' : 'heart'); });
  if (location.hash === '#/liked') refreshView();
  toast(on ? 'Guardada en Me gusta' : 'Quitada de Me gusta');
}

/* ---------- playlists ---------- */
async function newPlaylist(initialIds = []) {
  const name = await askText({ title: 'Nueva playlist', label: 'Nombre de la playlist', value: 'Mi playlist n.º ' + (S.playlists.length + 1), ok: 'Crear' });
  if (!name) return null;
  const p = { id: uid(), name, ids: [...new Set(initialIds)], created: Date.now() };
  S.playlists.push(p); savePlaylists(); renderSidebar();
  toast(initialIds.length ? `Playlist «${name}» creada` : `Playlist «${name}» creada`);
  if (location.hash === '#/playlists') refreshView();
  return p;
}
function addToPlaylist(pid, ids) {
  const p = S.playlists.find(x => x.id === pid); if (!p) return;
  const add = ids.filter(id => !p.ids.includes(id));
  p.ids.push(...add); savePlaylists(); renderSidebar();
  toast(add.length ? `Agregada a «${p.name}»` : `Ya estaba en «${p.name}»`);
  if (location.hash === '#/playlist/' + pid) refreshView();
}
function pickPlaylist(ids) {
  const rows = S.playlists.map(p => `<button class="mi" data-pl="${p.id}">${mosaic(playlistIds(p).slice(0, 4), p.name).replace('class="cv', 'class="thumb cv')}<span>${esc(p.name)}</span></button>`).join('');
  modal(`<h3>Agregar a playlist</h3><div class="plpick"><button class="mi" data-new="1"><span class="thumb ph cv" style="--h:20">${ic('plus')}</span><span>Nueva playlist</span></button>${rows}</div><div class="mact"><button class="btn ghost" data-m="x">Cerrar</button></div>`);
  $('#modal').onclick = async e => {
    if (e.target.closest('[data-m]')) return closeModal();
    const b = e.target.closest('[data-pl]');
    if (b) { closeModal(); addToPlaylist(b.dataset.pl, ids); return; }
    if (e.target.closest('[data-new]')) { closeModal(); const p = await newPlaylist(ids); if (p) toast(`Agregada a «${p.name}»`); }
  };
}
async function renamePlaylist(id) {
  const p = S.playlists.find(x => x.id === id); if (!p) return;
  const n = await askText({ title: 'Cambiar nombre', value: p.name, label: 'Nombre' });
  if (!n) return;
  p.name = n; savePlaylists(); renderSidebar(); refreshView();
}
async function deletePlaylist(id) {
  const p = S.playlists.find(x => x.id === id); if (!p) return;
  if (!await confirmBox({ title: '¿Eliminar playlist?', text: `«${p.name}» se eliminará. Tus canciones seguirán en la biblioteca.`, ok: 'Eliminar', danger: true })) return;
  S.playlists = S.playlists.filter(x => x.id !== id); savePlaylists(); renderSidebar();
  if (location.hash === '#/playlist/' + id) location.hash = '#/playlists'; else refreshView();
  toast('Playlist eliminada');
}
function removeFromPlaylist(pid, id) {
  const p = S.playlists.find(x => x.id === pid); if (!p) return;
  p.ids = p.ids.filter(x => x !== id); savePlaylists(); renderSidebar(); refreshView();
}

/* ---------- editar / eliminar canciones ---------- */
function editTrack(id) {
  const t = T(id); if (!t) return;
  modal(`<h3>Editar información</h3>
    <label class="fld"><span>Título</span><input class="inp" id="e_title" value="${esc(t.title)}"></label>
    <label class="fld"><span>Artista</span><input class="inp" id="e_artist" value="${esc(t.artist)}"></label>
    <label class="fld"><span>Álbum</span><input class="inp" id="e_album" value="${esc(t.album)}"></label>
    <label class="fld"><span>Artista del álbum (opcional)</span><input class="inp" id="e_aa" value="${esc(t.albumArtist || '')}"></label>
    <div class="frow"><label class="fld"><span>Año</span><input class="inp" id="e_year" inputmode="numeric" value="${t.year || ''}"></label><label class="fld"><span>N.º de pista</span><input class="inp" id="e_track" inputmode="numeric" value="${t.track || ''}"></label></div>
    <div class="mact"><button class="btn ghost" data-m="x">Cancelar</button><button class="btn pri" data-m="ok">Guardar</button></div>`);
  $('#e_title').focus();
  $('#modal').onclick = e => {
    const b = e.target.closest('[data-m]'); if (!b) return;
    if (b.dataset.m === 'ok') {
      t.title = $('#e_title').value.trim() || t.title;
      t.artist = $('#e_artist').value.trim(); t.album = $('#e_album').value.trim();
      t.albumArtist = $('#e_aa').value.trim();
      t.year = parseInt($('#e_year').value, 10) || 0; t.track = parseInt($('#e_track').value, 10) || 0;
      persistTrack(t); reindex(); renderSidebar(); refreshView(); if (P.cur === id) npUpdate();
      toast('Información actualizada');
    }
    closeModal();
  };
}

function gcCovers() {
  const used = new Set([...S.tracks.values()].map(t => t.coverKey).filter(Boolean));
  for (const [k, u] of [...S.covers]) if (!used.has(k)) { URL.revokeObjectURL(u); S.covers.delete(k); DB.del('covers', k); }
}
async function deleteTracks(ids) {
  const n = ids.length;
  const t0 = T(ids[0]);
  if (!await confirmBox({
    title: n === 1 ? '¿Eliminar canción?' : `¿Eliminar ${n} canciones?`,
    text: n === 1 ? `«${t0.title}» se quitará de la biblioteca de Sonora (el archivo original en tu equipo no se toca).` : 'Se quitarán de la biblioteca de Sonora (los archivos originales en tu equipo no se tocan).',
    ok: 'Eliminar', danger: true
  })) return;
  const set = new Set(ids);
  for (const id of ids) { S.tracks.delete(id); S.likes.delete(id); DB.del('tracks', id); DB.del('files', id); }
  S.playlists.forEach(p => { p.ids = p.ids.filter(x => !set.has(x)); });
  P.queue = P.queue.filter(x => !set.has(x));
  P.history = P.history.filter(h => !set.has(h.id));
  const cur = P.cur;
  P.ctx.list = P.ctx.list.filter(x => !set.has(x));
  const wasPos = P.ctx.pos;
  P.ctx.order = P.ctx.order.filter(x => !set.has(x));
  P.ctx.pos = Math.min(wasPos, P.ctx.order.length - 1);
  if (cur && set.has(cur)) {
    P.token++; audio.pause(); audio.removeAttribute('src'); audio.load();
    if (P.url) { URL.revokeObjectURL(P.url); P.url = null; }
    P.cur = null; $('#tCur').textContent = '0:00'; $('#tDur').textContent = '0:00'; seekEl.value = 0; setRange(seekEl);
    syncPlayState();
  }
  saveLikes(); savePlaylists(); gcCovers(); reindex(); renderSidebar(); refreshView(); npUpdate(); savePlayer();
  toast(n === 1 ? 'Canción eliminada' : `${n} canciones eliminadas`);
}

/* ---------- menú de una canción ---------- */
function trackMenu(id, x, y, plId) {
  const t = T(id); if (!t) return;
  const liked = S.likes.has(id);
  const items = [
    { label: 'Reproducir', icon: 'play', fn: () => playList([id], 0, '') },
    { label: 'Reproducir a continuación', icon: 'queue', fn: () => queueNext(id) },
    { label: 'Agregar a la cola', icon: 'queue', fn: () => queueAdd(id) },
    { sep: true },
    { label: liked ? 'Quitar de Me gusta' : 'Guardar en Me gusta', icon: liked ? 'heart-fill' : 'heart', fn: () => toggleLike(id) },
    { label: 'Agregar a playlist…', icon: 'plus', fn: () => pickPlaylist([id]) }
  ];
  if (plId) items.push({ label: 'Quitar de esta playlist', icon: 'close', fn: () => removeFromPlaylist(plId, id) });
  items.push({ sep: true },
    { label: 'Ir al artista', icon: 'artist', fn: () => { location.hash = '#/artist/' + t._aid; } },
    { label: 'Ir al álbum', icon: 'album', fn: () => { location.hash = '#/album/' + t._bid; } },
    { label: 'Editar información', icon: 'edit', fn: () => editTrack(id) },
    { label: 'Eliminar de la biblioteca', icon: 'trash', danger: true, fn: () => deleteTracks([id]) });
  openMenu(x, y, items);
}
/* ---------- vistas ---------- */
const V = { lists: {}, opts: {}, io: null, drag: null, key: '' };
const CHUNK = 200;
const view = $('#view');

function sec(title, inner, more) {
  return `<section class="sec"><div class="sec-h"><h2>${title}</h2>${more ? `<a href="${more}">Mostrar todo</a>` : ''}</div>${inner}</section>`;
}
function card(o) {
  return `<div class="card ${o.circ ? 'circ' : ''} ${o.cls || ''}" data-href="${o.href}"><div class="cvw">${o.img}${o.play ? `<button class="pb" data-act="card-play" data-kind="${o.play.kind}" data-id="${o.play.id}" title="Reproducir">${ic('play')}</button>` : ''}</div><div class="c1">${esc(o.title)}</div><div class="c2">${esc(o.sub || '')}</div></div>`;
}
const albumCard = al => card({ href: '#/album/' + al.id, img: imgHTML(al.coverUrl, al.name), title: al.name, sub: `${al.year ? al.year + ' · ' : ''}${al.artist}`, play: { kind: 'album', id: al.id } });
const artistCard = ar => card({ href: '#/artist/' + ar.id, circ: true, img: imgHTML(ar.coverUrl, ar.name), title: ar.name, sub: plural(ar.ids.length, 'canción', 'canciones'), play: { kind: 'artist', id: ar.id } });
const plCard = p => card({ href: '#/playlist/' + p.id, img: mosaic(playlistIds(p), p.name), title: p.name, sub: plural(playlistIds(p).length, 'canción', 'canciones'), play: { kind: 'playlist', id: p.id } });

function hero({ kind, title, meta, cover, coverUrl, round, small }) {
  return `<div class="hero ${round ? 'round' : ''} ${small ? 'small' : ''}" data-cover="${coverUrl || ''}">${cover || ''}<div class="hinfo"><div class="kind">${kind}</div><h1>${esc(title)}</h1><div class="meta">${meta}</div></div></div>`;
}
function actionsHTML(kind, id, extra = '') {
  return `<div class="actions"><button class="bigplay" data-act="play-all" data-kind="${kind}" data-id="${id}" title="Reproducir">${ic('play')}</button><button class="ib tgl ${P.shuffle ? 'on' : ''}" data-act="shuffle-all" data-kind="${kind}" data-id="${id}" title="Reproducción aleatoria">${ic('shuffle')}</button>${extra}</div>`;
}
const sumDur = ids => ids.reduce((a, id) => a + ((T(id) || {}).duration || 0), 0);

/* lista de canciones (con carga por bloques para bibliotecas grandes) */
function rowHTML(id, i, key, o) {
  const t = T(id); if (!t) return '';
  const liked = S.likes.has(id);
  return `<div class="row ${o.noAlbum ? 'noalb' : ''}" data-id="${id}" data-key="${key}" data-i="${i}" ${o.drag ? 'draggable="true"' : ''}>
    <div class="idx"><span class="n">${i + 1}</span><button class="ib sm rp" data-act="row-play" title="Reproducir">${ic('play')}</button><span class="eq"><i></i><i></i><i></i></span></div>
    <div class="ttl">${o.noCover ? '' : imgHTML(coverOf(t), t.title, 'thumb')}<div class="tt"><div class="t1">${esc(t.title)}</div><div class="t2"><a href="#/artist/${t._aid}">${esc(artistName(t))}</a></div></div></div>
    ${o.noAlbum ? '' : `<div class="alb"><a href="#/album/${t._bid}">${esc(albumName(t))}</a></div>`}
    <button class="ib sm heart ${liked ? 'on' : ''}" data-act="like" title="Me gusta">${ic(liked ? 'heart-fill' : 'heart')}</button>
    <div class="dur">${fmtTime(t.duration)}</div>
    <button class="ib sm" data-act="more" title="Más opciones">${ic('more')}</button>
  </div>`;
}
function trackList(key, ids, o = {}) {
  V.lists[key] = ids; V.opts[key] = o;
  const head = `<div class="thead ${o.noAlbum ? 'noalb' : ''}"><span>#</span><span>Título</span>${o.noAlbum ? '' : '<span class="alb">Álbum</span>'}<span></span><span class="r">${ic('clock')}</span><span></span></div>`;
  const first = ids.slice(0, CHUNK).map((id, i) => rowHTML(id, i, key, o)).join('');
  const more = ids.length > CHUNK ? `<div class="more" data-key="${key}" data-next="${CHUNK}"></div>` : '';
  return `<div class="tl">${head}<div class="tbody">${first}</div>${more}</div>`;
}
function setupMore() {
  if (V.io) V.io.disconnect();
  V.io = new IntersectionObserver(es => { for (const e of es) if (e.isIntersecting) loadMore(e.target); }, { root: view, rootMargin: '800px' });
  $$('.more', view).forEach(m => V.io.observe(m));
}
function loadMore(m) {
  const key = m.dataset.key, ids = V.lists[key], o = V.opts[key] || {};
  let n = +m.dataset.next;
  m.previousElementSibling.insertAdjacentHTML('beforeend', ids.slice(n, n + CHUNK).map((id, k) => rowHTML(id, n + k, key, o)).join(''));
  n += CHUNK;
  V.io.unobserve(m);
  if (n >= ids.length) m.remove(); else { m.dataset.next = n; V.io.observe(m); }
  markPlaying();
}

/* ---- vistas concretas ---- */
function emptyHTML() {
  return `<div class="empty"><div class="big">${ic('note')}</div><h2>Tu música, tu biblioteca</h2><p>Agrega canciones, carpetas o álbumes comprimidos en .zip, o simplemente arrástralos a esta ventana. Sonora lee las etiquetas y portadas (MP3, M4A, FLAC, OGG, Opus, WAV) y guarda todo en este navegador.</p><div class="rowb"><button class="btn pri" data-act="add-files">Agregar archivos o .zip</button><button class="btn ghost" data-act="add-folder">Agregar carpeta</button></div></div>`;
}
const notFound = () => `<div class="empty"><h2>No encontramos esto</h2><p>Puede que se haya eliminado de la biblioteca.</p><div class="rowb"><a class="btn pri" href="#/" style="display:grid;place-items:center;text-decoration:none">Ir al inicio</a></div></div>`;

function viewHome() {
  if (!S.tracks.size) return emptyHTML();
  const h = new Date().getHours();
  const greet = h < 6 ? 'Buenas noches' : h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
  let out = `<h1 class="greet">${greet}</h1>`;
  const tiles = [`<div class="qt" data-href="#/liked">${likedCover()}<div class="q1">Canciones que te gustan</div><button class="pb" data-act="card-play" data-kind="liked" data-id="" title="Reproducir">${ic('play')}</button></div>`];
  S.playlists.slice(-5).reverse().forEach(p => tiles.push(`<div class="qt" data-href="#/playlist/${p.id}">${mosaic(playlistIds(p), p.name)}<div class="q1">${esc(p.name)}</div><button class="pb" data-act="card-play" data-kind="playlist" data-id="${p.id}" title="Reproducir">${ic('play')}</button></div>`));
  out += `<div class="qgrid">${tiles.join('')}</div>`;

  const all = [...S.tracks.values()];
  const seen = new Set(), recent = [];
  for (const t of all.filter(t => t.last).sort((a, b) => b.last - a.last)) { if (!seen.has(t._bid)) { seen.add(t._bid); recent.push(S.albums.get(t._bid)); } if (recent.length >= 8) break; }
  if (recent.length) out += sec('Escuchado recientemente', `<div class="grid">${recent.map(albumCard).join('')}</div>`);
  const added = [...S.albums.values()].sort((a, b) => b.added - a.added).slice(0, 8);
  out += sec('Agregado recientemente', `<div class="grid">${added.map(albumCard).join('')}</div>`, '#/albums');
  const arts = [...S.artists.values()].sort((a, b) => b.plays - a.plays || b.ids.length - a.ids.length).slice(0, 8);
  out += sec('Tus artistas', `<div class="grid">${arts.map(artistCard).join('')}</div>`, '#/artists');
  const top = all.filter(t => t.plays > 0).sort((a, b) => b.plays - a.plays).slice(0, 10).map(t => t.id);
  if (top.length) out += sec('Lo que más escuchas', trackList('home-top', top, {}));
  return out;
}

function viewSongs() {
  const ids = sortedSongs();
  if (!ids.length) return emptyHTML();
  const sel = `<select class="sel" data-sort aria-label="Ordenar">${[['recent', 'Agregadas recientemente'], ['title', 'Título'], ['artist', 'Artista'], ['album', 'Álbum'], ['plays', 'Más reproducidas']].map(([v, l]) => `<option value="${v}" ${S.sortSongs === v ? 'selected' : ''}>${l}</option>`).join('')}</select>`;
  return hero({ kind: 'Biblioteca', title: 'Canciones', small: true, meta: `${plural(ids.length, 'canción', 'canciones')} · ${fmtLong(sumDur(ids))}` })
    + actionsHTML('songs', '', sel) + trackList('songs', ids, {});
}
function viewLiked() {
  const ids = likedIds();
  return hero({ kind: 'Playlist', title: 'Canciones que te gustan', cover: likedCover(), meta: `${plural(ids.length, 'canción', 'canciones')}${ids.length ? ' · ' + fmtLong(sumDur(ids)) : ''}` })
    + (ids.length ? actionsHTML('liked', '') + trackList('liked', ids, {}) : `<div class="empty"><h2>Aún no tienes favoritas</h2><p>Toca el corazón de cualquier canción para guardarla aquí.</p></div>`);
}
function viewArtists() {
  const a = [...S.artists.values()].sort((x, y) => COLL.compare(x.name, y.name));
  if (!a.length) return emptyHTML();
  return hero({ kind: 'Biblioteca', title: 'Artistas', small: true, meta: plural(a.length, 'artista', 'artistas') }) + `<div class="grid" style="padding-top:12px">${a.map(artistCard).join('')}</div>`;
}
function viewAlbums() {
  const a = [...S.albums.values()].sort((x, y) => COLL.compare(x.artist, y.artist) || ((y.year || 0) - (x.year || 0)) || COLL.compare(x.name, y.name));
  if (!a.length) return emptyHTML();
  return hero({ kind: 'Biblioteca', title: 'Álbumes', small: true, meta: plural(a.length, 'álbum', 'álbumes') }) + `<div class="grid" style="padding-top:12px">${a.map(albumCard).join('')}</div>`;
}
function viewPlaylists() {
  const cards = S.playlists.map(plCard).join('');
  const add = card({ href: '#/playlists', cls: 'add', img: `<div class="cv">${ic('plus')}</div>`, title: 'Nueva playlist', sub: 'Crea una colección' }).replace('data-href="#/playlists"', 'data-act="new-playlist"');
  return hero({ kind: 'Biblioteca', title: 'Playlists', small: true, meta: plural(S.playlists.length, 'playlist', 'playlists') }) + `<div class="grid" style="padding-top:12px">${add}${cards}</div>`;
}
function viewPlaylist(id) {
  const p = S.playlists.find(x => x.id === id); if (!p) return notFound();
  const ids = playlistIds(p);
  const extra = `<button class="ib" data-act="rename-pl" data-id="${p.id}" title="Cambiar nombre">${ic('edit')}</button><button class="ib" data-act="delete-pl" data-id="${p.id}" title="Eliminar playlist">${ic('trash')}</button>`;
  return hero({ kind: 'Playlist', title: p.name, cover: mosaic(ids, p.name), coverUrl: ids.length ? coverOf(T(ids[0])) : '', meta: `${plural(ids.length, 'canción', 'canciones')}${ids.length ? ' · ' + fmtLong(sumDur(ids)) : ''}` })
    + actionsHTML('playlist', p.id, extra)
    + (ids.length ? trackList('pl-' + p.id, ids, { drag: true, plId: p.id }) : `<div class="empty" style="padding-top:5vh"><h2>Esta playlist está vacía</h2><p>Agrega canciones desde el menú ⋯ de cualquier canción, o arrástralas aquí desde la lista.</p></div>`);
}
function viewAlbum(id) {
  const al = S.albums.get(id); if (!al) return notFound();
  return hero({ kind: 'Álbum', title: al.name, cover: imgHTML(al.coverUrl, al.name), coverUrl: al.coverUrl, meta: `<a href="#/artist/${al.artistId}">${esc(al.artist)}</a>${al.year ? ' · ' + al.year : ''} · ${plural(al.ids.length, 'canción', 'canciones')}, ${fmtLong(al.dur)}` })
    + actionsHTML('album', al.id) + trackList('album-' + al.id, al.ids, { noAlbum: true });
}
function viewArtist(id) {
  const ar = S.artists.get(id); if (!ar) return notFound();
  const albs = [...ar.albums].map(b => S.albums.get(b)).sort((a, b) => (b.year || 0) - (a.year || 0));
  return hero({ kind: 'Artista', title: ar.name, round: true, cover: imgHTML(ar.coverUrl, ar.name), coverUrl: ar.coverUrl, meta: `${plural(ar.ids.length, 'canción', 'canciones')} · ${plural(albs.length, 'álbum', 'álbumes')}` })
    + actionsHTML('artist', ar.id)
    + sec('Canciones', trackList('artist-' + ar.id, ar.ids, {}))
    + sec('Álbumes', `<div class="grid">${albs.map(albumCard).join('')}</div>`);
}
function viewSearch(q) {
  const toks = norm(q).split(/\s+/).filter(Boolean);
  if (!S.tracks.size) return emptyHTML();
  if (!toks.length) return `<div class="empty"><h2>Busca en tu música</h2><p>Canciones, artistas y álbumes. Prueba con un nombre o con parte de un título.</p></div>`;
  const ok = s => toks.every(t => s.includes(t));
  const songs = [...S.tracks.values()].filter(t => ok(t._s)).sort((a, b) => (norm(a.title).startsWith(toks[0]) ? 0 : 1) - (norm(b.title).startsWith(toks[0]) ? 0 : 1) || COLL.compare(a.title, b.title)).map(t => t.id);
  const arts = [...S.artists.values()].filter(a => ok(norm(a.name))).sort((a, b) => b.ids.length - a.ids.length).slice(0, 12);
  const albs = [...S.albums.values()].filter(a => ok(norm(a.name + ' ' + a.artist))).sort((a, b) => b.ids.length - a.ids.length).slice(0, 12);
  if (!songs.length && !arts.length && !albs.length) return `<div class="empty"><h2>Sin resultados para «${esc(q)}»</h2><p>Revisa la ortografía o prueba con otras palabras.</p></div>`;
  let o = '<div style="height:8px"></div>';
  if (songs.length) o += sec('Canciones', trackList('search', songs.slice(0, 50), {}));
  if (arts.length) o += sec('Artistas', `<div class="grid">${arts.map(artistCard).join('')}</div>`);
  if (albs.length) o += sec('Álbumes', `<div class="grid">${albs.map(albumCard).join('')}</div>`);
  return o;
}

const AUDIO_EXT = /\.(mp3|m4a|m4b|aac|flac|ogg|oga|opus|wav|weba)$/i;
const isAudio = f => (f.type && f.type.startsWith('audio/')) || AUDIO_EXT.test(f.name);
const isZip = f => /\.zip$/i.test(f.name) || /^application\/(x-)?zip(-compressed)?$/i.test(f.type || '');

function getDuration(file) {
  return new Promise(res => {
    const url = URL.createObjectURL(file), a = new Audio();
    let fin = false;
    const done = d => { if (fin) return; fin = true; clearTimeout(to); a.removeAttribute('src'); a.load(); URL.revokeObjectURL(url); res(d); };
    const to = setTimeout(() => done(0), 8000);
    a.preload = 'metadata';
    a.onloadedmetadata = () => done(isFinite(a.duration) ? a.duration : 0);
    a.onerror = () => done(0);
    a.src = url;
  });
}
async function makeCover(bytes) {
  try {
    const blob = new Blob([bytes], { type: Tags.sniff(bytes) || 'image/jpeg' });
    const bmp = await createImageBitmap(blob);
    const s = Math.min(bmp.width, bmp.height), out = Math.min(420, s);
    const c = document.createElement('canvas'); c.width = c.height = out;
    c.getContext('2d').drawImage(bmp, (bmp.width - s) / 2, (bmp.height - s) / 2, s, s, 0, 0, out, out);
    bmp.close && bmp.close();
    return await new Promise(r => c.toBlob(r, 'image/jpeg', 0.86));
  } catch (e) { console.warn('portada no válida', e); return null; }
}

const coverJobs = new Map();
function ensureCover(key, bytes) {
  if (S.covers.has(key)) return Promise.resolve();
  if (coverJobs.has(key)) return coverJobs.get(key);
  const job = (async () => {
    const blob = await makeCover(bytes);
    if (blob) { await DB.put('covers', { key, blob }); S.covers.set(key, URL.createObjectURL(blob)); }
  })().finally(() => coverJobs.delete(key));
  coverJobs.set(key, job);
  return job;
}

/* item = { name, size, get() → File, cover?() → bytes de la portada de la carpeta }
   (un archivo suelto o una canción dentro de un .zip: solo se descomprime si no es duplicada) */
async function importOne(item) {
  const id = hash(item.name + '|' + item.size);
  if (S.tracks.has(id)) return 'dup';
  const file = await item.get();
  const tg = await Tags.read(file), fb = fromFilename(file.name);
  const title = (tg.title || fb.title || file.name).trim();
  const artist = (tg.artist || fb.artist || '').trim();
  const album = (tg.album || '').trim();
  const albumArtist = (tg.albumArtist || '').trim();
  const coverKey = album ? hash('c:' + norm(albumArtist || artist) + '|' + norm(album)) : id;
  let pic = tg.pic;
  if (!pic && item.cover && !S.covers.has(coverKey)) { try { pic = await item.cover(); } catch (e) { console.warn('portada de la carpeta', e); } }
  if (pic) await ensureCover(coverKey, pic);
  const duration = await getDuration(file);
  const rec = {
    id, name: file.name, size: file.size, type: file.type || '', title, artist, albumArtist, album,
    track: tg.track || 0, year: tg.year || 0, duration, coverKey: S.covers.has(coverKey) ? coverKey : '',
    added: Date.now(), plays: 0, last: 0
  };
  await DB.put('files', file, id);
  await DB.put('tracks', rec);
  S.tracks.set(id, rec);
  return 'ok';
}

let importing = false;
async function importFiles(list) {
  const direct = list.filter(isAudio);
  const zips = list.filter(f => isZip(f) && !isAudio(f));
  if (!direct.length && !zips.length) { toast('No encontré archivos de audio ni .zip compatibles'); return; }
  if (importing) { toast('Espera a que termine la importación actual'); return; }
  importing = true;
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
  const items = direct.map(f => ({ name: f.name, size: f.size, get: async () => f }));
  let zipSkipped = 0, zipBad = 0;
  for (let i = 0; i < zips.length; i++) {
    prog(`Leyendo ${zips[i].name}…`, i / zips.length);
    try { const r = await Zip.audioItems(zips[i]); items.push(...r.items); zipSkipped += r.skipped; }
    catch (e) { console.warn('No se pudo leer el zip', zips[i].name, e); zipBad++; }
  }
  if (!items.length) {
    progHide(); importing = false;
    toast(zipBad ? 'No pude leer el .zip (¿está dañado?)' : zipSkipped ? 'El .zip tiene audio cifrado o en un formato que no puedo abrir' : 'El .zip no tiene audio compatible');
    return;
  }
  const total = items.length, queue = items.slice();
  let done = 0, added = 0, dup = 0, fail = 0, quota = false;
  prog(`Importando 0 de ${total}…`, 0);
  const worker = async () => {
    while (queue.length) {
      const it = queue.shift();
      try { (await importOne(it)) === 'dup' ? dup++ : added++; }
      catch (e) { console.error('Error al importar', it.name, e); fail++; if (e && e.name === 'QuotaExceededError') quota = true; }
      done++; prog(`Importando ${done} de ${total}…`, done / total);
    }
  };
  await Promise.all(Array.from({ length: Math.min(4, total) }, worker));
  reindex(); renderSidebar(); refreshView(); progHide(); importing = false;
  const parts = [];
  if (added) parts.push(`${plural(added, 'canción agregada', 'canciones agregadas')}`);
  if (dup) parts.push(`${dup} ya estaban`);
  if (fail) parts.push(quota ? 'sin espacio suficiente en el navegador' : `${fail} con error`);
  if (zipSkipped) parts.push(`${zipSkipped} del .zip no se pudieron abrir (cifradas o formato raro)`);
  if (zipBad) parts.push(`${zipBad} .zip dañado${zipBad > 1 ? 's' : ''}`);
  toast(parts.join(' · ') || 'Nada que agregar');
}

/* arrastrar y soltar (archivos y carpetas) */
async function filesFromDrop(dt) {
  const entries = [...(dt.items || [])].filter(i => i.kind === 'file').map(i => i.webkitGetAsEntry && i.webkitGetAsEntry()).filter(Boolean);
  const fallback = [...dt.files];
  if (!entries.length) return fallback;
  const out = [];
  const walk = async en => {
    if (en.isFile) await new Promise(r => en.file(f => { out.push(f); r(); }, r));
    else if (en.isDirectory) {
      const rd = en.createReader(); let batch;
      do { batch = await new Promise((res, rej) => rd.readEntries(res, rej)); for (const c of batch) await walk(c); } while (batch.length);
    }
  };
  for (const en of entries) await walk(en);
  return out;
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape') { if (modalOpen()) closeModal(); closeMenu(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase();
  if (['input', 'textarea', 'select'].includes(tag) || e.target.isContentEditable || modalOpen()) return;
  const k = e.key;
  if (k === ' ') { e.preventDefault(); toggle(); }
  else if (k === 'ArrowRight') { e.preventDefault(); if (e.shiftKey) next(false); else audio.currentTime = Math.min(audio.duration || 1e9, audio.currentTime + 5); }
  else if (k === 'ArrowLeft') { e.preventDefault(); if (e.shiftKey) prev(); else audio.currentTime = Math.max(0, audio.currentTime - 5); }
  else if (k === 'ArrowUp') { e.preventDefault(); audio.muted = false; audio.volume = Math.min(1, audio.volume + .05); }
  else if (k === 'ArrowDown') { e.preventDefault(); audio.volume = Math.max(0, audio.volume - .05); }
  else if (k === 'm' || k === 'M') $('#bMute').click();
  else if (k === 's' || k === 'S') setShuffle(!P.shuffle);
  else if (k === 'r' || k === 'R') setRepeat((P.repeat + 1) % 3);
  else if (k === 'l' || k === 'L') { if (P.cur) toggleLike(P.cur); }
  else if (k === 'q' || k === 'Q') toggleQueue();
  else if (k === '/') { e.preventDefault(); qEl.focus(); qEl.select(); }
});

(async function boot() {
  await DB.open();
  let tracks = [], covers = [], likes = [], playlists = [], settings = null, player = null, time = null;
  try {
    [tracks, covers, likes, playlists, settings, player, time] = await Promise.all([
      DB.all('tracks'), DB.all('covers'), kv.get('likes'), kv.get('playlists'), kv.get('settings'), kv.get('player'), kv.get('time')
    ]);
  } catch (e) { console.warn('No se pudo leer la biblioteca', e); }
  for (const c of covers || []) S.covers.set(c.key, URL.createObjectURL(c.blob));
  for (const t of tracks || []) S.tracks.set(t.id, t);
  S.likes = new Set(likes || []); S.playlists = playlists || [];
  reindex();

  // ajustes
  const st = settings || {};
  audio.volume = typeof st.vol === 'number' ? st.vol : .8; audio.muted = !!st.muted;
  volUI(); setShuffle(!!st.shuffle, false); setRepeat(st.repeat || 0);

  renderSidebar();
  render();

  // restaurar la última sesión (en pausa)
  if (player && player.cur && S.tracks.has(player.cur)) {
    const c = player.ctx || {};
    const keep = a => (a || []).filter(id => S.tracks.has(id));
    P.ctx = { list: keep(c.list), order: keep(c.order), pos: c.pos ?? -1, name: c.name || '' };
    const at = P.ctx.order.indexOf(player.cur); if (at >= 0) P.ctx.pos = at;
    P.queue = keep(player.queue);
    await load(player.cur, { autoplay: false, seek: time && time.id === player.cur ? time.t : 0 });
  } else npUpdate();
  if (st.q) toggleQueue(true);

  if (!DB.ok) setTimeout(() => toast('Tu navegador no permite guardar la biblioteca: se perderá al cerrar'), 800);
  window.addEventListener('beforeunload', () => { if (P.cur) kv.set('time', { id: P.cur, t: audio.currentTime }); });
})();
</script>
</body>
</html>
